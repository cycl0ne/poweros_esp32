<?xml version="1.0" encoding="UTF-8"?>
<!-- svg.datatype 1.3's test picture: text in FONTS:sans, serif and mono
     - bold, italic, a tspan, kerning, anchors, an underline, a list of
     x - a blur as Inkscape writes one and as Figma does, a filter it
     cannot make drawn without it, a picture in the file, and a stroke
     under its fill. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="320" height="240" viewBox="0 0 160 120">
  <defs>
    <filter id="glow" x="-0.5" y="-0.5" width="2" height="2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="figma" x="60" y="70" width="90" height="45" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="1.5" result="effect1_foregroundBlur"/>
    </filter>
    <filter id="shadow"><feOffset dx="1" dy="1"/></filter>
  </defs>
  <rect width="160" height="120" fill="#eeeeec"/>
  <circle cx="24" cy="24" r="12" fill="#fce94f" filter="url(#glow)"/>
  <text x="44" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#204a87">AVATAR <tspan font-weight="bold" fill="#a40000">Text</tspan></text>
  <text x="44" y="36" font-family="Times New Roman" font-size="11" font-style="italic">in serif, italic</text>
  <text x="80" y="54" font-family="monospace" font-size="9" text-anchor="middle" text-decoration="underline">mono, in the middle</text>
  <text x="8 20 32 44" y="68" font-family="sans-serif" font-size="10" fill="#5c3566">ABCD</text>
  <text x="152" y="68" font-family="serif" font-size="10" font-weight="bold" text-anchor="end" filter="url(#shadow)">bold, at the end</text>
  <image x="8" y="76" width="32" height="32" xlink:href="data:image/png;base64,
         iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAARElEQVR42mMwSV3CAMT/Yfhr
         JQMKLr4khoLPMDAgYwYUzWQY8H8QGECqBnQLh4MBpGpAt3A4GECqBnQLB4cBDBQYwAAAV/ov
         o3ADndYAAAAASUVORK5CYII="/>
  <rect x="62" y="80" width="38" height="24" rx="4" fill="#729fcf" filter="url(#figma)"/>
  <text x="128" y="100" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle"
        fill="#fcaf3e" stroke="#ce5c00" stroke-width="3" paint-order="stroke">Go</text>
</svg>
